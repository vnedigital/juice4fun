<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice 4 Fun - Premium Fresh & Drinks</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Elegant Serif & Cursive Look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        juiceGreen: '#0f5132',
                        juiceRed: '#ff4d4d',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        cursive: ['"Great Vibes"', 'cursive'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased selection:bg-juiceRed selection:text-white overflow-x-hidden">

    <!-- Transparent Floating Header (Jevelin Style) -->
    <header class="absolute top-0 left-0 right-0 z-50 transition-all bg-transparent">
        <div class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
            <!-- Logo / Brand Name -->
            <div class="flex items-center">
                <a href="#home" class="flex items-center">
                    <img src="logo.png" alt="Juice 4 Fun" class="h-10 w-auto object-contain brightness-0 invert">
                </a>
            </div>

            <!-- Nav Links -->
            <nav class="hidden md:flex space-x-8 font-serif text-sm tracking-wide text-zinc-300">
                <a href="#home" class="hover:text-white transition">Home</a>
                <a href="#about" class="hover:text-white transition">About us</a>
                <a href="#menu" class="hover:text-white transition">Menu</a>
                <a href="#team" class="hover:text-white transition">Management</a>
                <a href="#contact" class="hover:text-white transition">Contacts</a>
            </nav>

            <!-- Right Icons -->
            <div class="hidden md:flex items-center space-x-5 text-zinc-300 text-sm">
                <button onclick="alert('Search clicked!')" class="hover:text-white transition"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="#" class="hover:text-white transition"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="hover:text-white transition"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="hover:text-white transition"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </header>

    <!-- Side Floating Toolbar (Jevelin Style Right Panel) -->
    <div class="fixed right-4 top-1/2 -translate-y-1/2 z-40 hidden lg:flex flex-col gap-3 bg-zinc-900/80 backdrop-blur-md p-2 rounded-xl border border-zinc-800 shadow-2xl">
        <button class="w-10 h-10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition" title="Layout Options"><i class="fa-solid fa-layer-group"></i></button>
        <button class="w-10 h-10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition relative" title="Cart"><i class="fa-solid fa-cart-shopping"></i><span class="absolute top-2 right-2 w-2 h-2 bg-juiceRed rounded-full"></span></button>
        <button class="w-10 h-10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition" title="Settings"><i class="fa-solid fa-sliders"></i></button>
        <button class="w-10 h-10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition" title="Messages"><i class="fa-regular fa-envelope"></i></button>
    </div>

    <!-- Full Screen Hero Section -->
    <section id="home" class="relative w-full h-screen flex items-center justify-center bg-cover bg-center" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('juice-cup.png');">
        
        <div class="text-center px-4 max-w-4xl mx-auto z-10 mt-12">
            <!-- Cursive Accent Text -->
            <span class="font-cursive text-juiceRed text-4xl md:text-5xl block mb-2 drop-shadow-md">Premium</span>
            
            <!-- Main Serif Heading -->
            <h1 class="font-serif text-5xl md:text-7xl lg:text-8xl font-normal text-white tracking-wide drop-shadow-2xl leading-tight">
                Fresh Drinks <span class="italic font-light">& Dishes</span>
            </h1>

            <!-- Scroll Down Indicator Animation -->
            <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center">
                <a href="#menu" class="w-6 h-10 border-2 border-white/40 rounded-full flex justify-center p-1 hover:border-white transition">
                    <div class="w-1.5 h-3 bg-white rounded-full animate-bounce"></div>
                </a>
            </div>
        </div>
    </section>

    <!-- Menu Section / Container Placeholder -->
    <section id="menu" class="py-24 px-6 max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <span class="font-cursive text-juiceRed text-3xl">Discover Our Taste</span>
            <h2 class="font-serif text-4xl md:text-5xl mt-2 text-zinc-100">Our Signature <span class="text-juiceRed italic">Menu</span></h2>
        </div>
    </section>

</body>
</html>
